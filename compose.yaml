services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx_local_only
      POSTGRES_DB: sentinelx
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx -d sentinelx"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
